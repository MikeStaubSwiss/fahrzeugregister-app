<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fahrzeugregister</title>
<meta name="description" content="Fahrzeuge per Foto des Schweizer Fahrzeugausweises erfassen, suchen, sortieren und sichern.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='3' fill='%23fff' stroke='%231d2320' stroke-width='2'/%3E%3Ctext x='16' y='20.5' font-family='monospace' font-size='9' text-anchor='middle' fill='%231d2320'%3EZH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
/* Layout: werkzeug — kopfzeile mit aktionen, darunter sortierbare tabelle; detail als blatt im stil des fahrzeugausweises (feldnummern links, schreibmaschinenwerte rechts) */
:root{
  --bg:#eceee8; --paper:#dfe0d3; --surface:#f7f8f4; --ink:#1d2320; --muted:#5d665f; --line:#c3c6b7;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#d3e3e4; --danger:#a3332b; --ok:#2f6b3a; --warn:#8a5a00; --warn-soft:#fbe7b5;
  --f-display:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --paper:#232a26; --surface:#1b211e; --ink:#e3e7df; --muted:#9aa49c; --line:#38423c;
  --accent:#6fb3bf; --accent-ink:#0f1a1c; --accent-soft:#213a3e; --danger:#e07b70; --ok:#7cc28a; --warn:#f0c060; --warn-soft:#4a3a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --paper:#232a26; --surface:#1b211e; --ink:#e3e7df; --muted:#9aa49c; --line:#38423c;
  --accent:#6fb3bf; --accent-ink:#0f1a1c; --accent-soft:#213a3e; --danger:#e07b70; --ok:#7cc28a; --warn:#f0c060; --warn-soft:#4a3a12; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.sub b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:14px;font-weight:600;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:hover{border-color:var(--ink)}
.danger{color:var(--danger)}
button:disabled{opacity:.55;cursor:default}
.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn{position:relative}
svg.i{width:16px;height:16px;flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.notice{font-size:13px;padding:9px 12px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink)}
.notice.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{text-align:left;background:var(--paper);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
th button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;padding:9px 12px;width:100%;box-sizing:border-box;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
th button[aria-sort] {color:var(--ink)}
th .nr{font-family:var(--f-mono);letter-spacing:0;opacity:.7}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plate{font-family:var(--f-mono);font-weight:500;display:inline-block;border:1.5px solid var(--ink);border-radius:4px;padding:1px 7px;background:var(--surface);white-space:nowrap}
.plate.gelb{background:#f2d64b;color:#1d2320;border-color:#1d2320}
.plate.blau{background:#2c55a3;color:#fff;border-color:#2c55a3}
.plate.gruen{background:#3e7d4e;color:#fff;border-color:#3e7d4e}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--muted);margin-top:4px}
.chip.vet{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;width:100%;max-width:980px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-size:22px;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-body{padding:16px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:0;margin:0;background:var(--surface);min-width:0}
legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:0 6px;margin-left:8px}
.row{display:grid;grid-template-columns:34px minmax(0,130px) minmax(0,1fr);align-items:center;border-top:1px solid var(--line);min-height:38px}
.row:first-of-type{border-top:0}
.row .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.row label{font-size:12px;color:var(--muted);padding-right:8px}
.row input,.row textarea{font-family:var(--f-mono);font-size:14px;color:var(--ink);border:0;background:transparent;padding:8px 10px 8px 0;width:100%;min-width:0}
.row textarea{resize:vertical;min-height:70px;line-height:1.4}
.row input[readonly],.row textarea[readonly]{cursor:text}
.row.unsure{box-shadow:inset 3px 0 0 var(--warn)}
.row.unsure input,.row.unsure textarea{background:var(--warn-soft)!important}
.row.unsure label::after{content:" unsicher";color:var(--warn);font-weight:600;font-size:10.5px;letter-spacing:.03em}
.editing .row input,.editing .row textarea{background:var(--bg);border-radius:4px;padding-left:8px;margin-block:3px;margin-right:6px}
.row.wide{grid-template-columns:34px minmax(0,1fr)}
.row.wide label{grid-column:2;padding-top:8px}
.row.wide textarea{grid-column:2}
.unit{font-size:11px;color:var(--muted)}
.scan{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.scan img{border:1px solid var(--line);border-radius:var(--r);max-height:340px;object-fit:contain;width:100%;background:var(--surface)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--danger);border-radius:var(--r);background:var(--surface)}
.confirm span{flex:1 1 220px;font-size:14px}
.status{display:flex;gap:10px;align-items:center;font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
textarea.dump{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:8px}
/* Ausweis-Nachbildung */
:root{--aw-paper:#d8dbc9;--aw-ink:#1e231f;--aw-line:#4b5349;--aw-label:#4b5349;--aw-band:rgba(180,200,90,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--aw-paper:#2a312b;--aw-ink:#e1e6da;--aw-line:#7b8679;--aw-label:#a7b1a5;--aw-band:rgba(180,200,90,.08)}}
:root[data-theme="dark"]{--aw-paper:#2a312b;--aw-ink:#e1e6da;--aw-line:#7b8679;--aw-label:#a7b1a5;--aw-band:rgba(180,200,90,.08)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cards{display:grid;gap:18px}
.awcard{display:grid;gap:10px}
.awcard-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.awcard-head h3{margin:0;font-family:var(--f-display);font-size:19px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px 18px;background:var(--aw-paper);color:var(--aw-ink);
  border-radius:4px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.pg{position:relative;border:1.5px solid var(--aw-line);align-self:start;min-width:0}
.pgno{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--f-body);background:var(--aw-paper);padding:0 6px;color:var(--aw-label)}
.c{display:grid;grid-template-columns:30px minmax(0,92px) minmax(0,1fr);border-top:1px solid var(--aw-line);min-height:34px}
.pg>.c:first-of-type,.pg>.pair:first-of-type .c{border-top:0}
.c .nr{font-family:var(--f-body);font-size:10px;color:var(--aw-label);padding:5px 0 0 5px}
.c .lb{hyphens:auto;overflow-wrap:anywhere;font-family:var(--f-body);font-size:10.5px;line-height:1.2;color:var(--aw-label);padding:5px 6px 5px 0;background:var(--aw-band);border-right:1px solid var(--aw-line)}
.c .lb i{font-style:normal;opacity:.8}
.c .val{font-family:var(--f-mono);font-size:14.5px;line-height:1.35;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;gap:8px;justify-content:space-between;align-items:baseline}
.c .val.r{justify-content:flex-end;text-align:right}
.c .val.big{font-size:19px;font-weight:500;letter-spacing:.02em}
.c .val .code{margin-left:auto;text-align:right;font-size:14.5px;border-left:1px solid var(--aw-line);padding-left:8px;display:grid;line-height:1.1}
.c .val .code small{font-family:var(--f-body);font-size:9.5px;color:var(--aw-label)}
.c .val .side{margin-left:auto;font-size:14px}
.c.halter .val{display:block;font-size:15px;line-height:1.7}
.c.halter .anr{display:block;text-align:right}
.c.stack{grid-template-columns:30px minmax(0,1fr)}
.c.stack .lb{border-right:0;background:none;padding-top:6px}
.c.stack .val{grid-column:2;display:block;min-height:120px;padding-left:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pair .c+.c{border-left:1px solid var(--aw-line)}
.pair .c{grid-template-columns:26px minmax(0,88px) minmax(0,1fr)}
@media (max-width:460px){.pair{grid-template-columns:minmax(0,1fr)}.pair .c+.c{border-left:0}.c .val{font-size:13.5px}}
details.foto summary{cursor:pointer;font-size:13px;color:var(--muted);padding:2px 0}
details.foto img{margin-top:8px;border:1px solid var(--line);border-radius:var(--r);width:100%;max-height:520px;object-fit:contain;background:var(--surface)}
.copy{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.copy a{color:inherit}
.copy .ver{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* Live-Scan */
.live{position:fixed;inset:0;z-index:30;background:#0b0f0d;display:flex;flex-direction:column}
.live-video{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#000;padding-top:env(safe-area-inset-top,0px)}
.live-video video{width:100%;height:100%;object-fit:contain;display:block}
.live-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#f2f4ef;padding:6px 12px;border-radius:12px;font-size:13px;line-height:1.3;max-width:92%;width:max-content;text-align:center}
.live-panel{flex:0 0 auto;max-height:42%;overflow:auto;background:var(--paper);color:var(--ink);display:grid;gap:10px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.live-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.live-top strong{font-size:15px;font-variant-numeric:tabular-nums}
.lvbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.lvbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.lvchips,.lvlegend{display:flex;flex-wrap:wrap;gap:5px}
.lvlegend{font-size:11.5px;color:var(--muted);gap:12px}
.lvlegend span{display:inline-flex;align-items:center;gap:5px}
.lvdot{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-block}
.lvdot.ok{background:var(--ok);border-color:var(--ok)}
.lvdot.maybe{background:var(--warn-soft);border-color:var(--warn)}
.lvchip{font-size:11.5px;line-height:1.25;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.lvchip.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.lvchip.maybe{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.lvbar i{transition:none}}
@media (min-aspect-ratio:5/4) and (min-width:700px),(orientation:landscape) and (max-height:520px){
  .live{flex-direction:row}
  .live-panel{width:min(380px,42vw);max-height:none;align-content:start}
}
@media (max-width:560px){h1{font-size:26px}.actions{width:100%}.actions>*{flex:1 1 auto;justify-content:center}}
</style>
</head>
<body>
<div class="wrap" lang="de">
  <header>
    <div>
      <h1>Fahrzeugregister</h1>
      <div class="sub" id="sub">Fahrzeuge aus dem Fahrzeugausweis erfassen, suchen und pflegen</div>
    </div>
    <div class="actions">
      <label class="btn primary" id="scanBtn" title="Foto des Fahrzeugausweises (Seiten 2 und 3) wählen">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Ausweis einlesen
        <input type="file" id="scanFile" accept="image/*">
      </label>
      <button id="liveBtn" hidden title="Kamera über den Ausweis bewegen, bis alle Felder gelesen sind"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 12h10"/></svg>Live-Scan</button>
      <button id="newBtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Manuell</button>
      <button id="backupBtn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Backup</button>
      <label class="btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V8m0 0-4 4m4-4 4 4M5 5h14"/></svg>Restore
        <input type="file" id="restoreFile" accept="application/json,.json">
      </label>
    </div>
  </header>

  <div id="msg" hidden></div>

  <div class="toolbar">
    <div class="search">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Suchen: Schild, Marke, Stammnummer, Halter, Fahrgestell …" autocomplete="off">
    </div>
    <div class="seg" role="group" aria-label="Ansicht">
      <button id="vTable" aria-pressed="true">Tabelle</button>
      <button id="vCards" aria-pressed="false">Ausweise</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="cards" id="cards" hidden></div>

  <div class="tablebox" id="tablebox">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <footer class="copy">© 2026 Mike Staub · Fahrzeugregister · <span class="ver">Version 1.0.0</span></footer>
</div>

<div class="live" id="live" lang="de" hidden>
  <div class="live-video">
    <video id="lvVideo" playsinline muted autoplay></video>
    <div class="live-hint" id="lvHint" role="status">Kamera wird gestartet …</div>
  </div>
  <div class="live-panel">
    <div class="live-top">
      <strong id="lvCount">0 von 36 Feldern bestätigt</strong>
      <div class="actions"><button class="primary" id="lvDone">Übernehmen</button><button id="lvCancel">Abbrechen</button></div>
    </div>
    <div class="lvbar"><i id="lvBar"></i></div>
    <div class="lvlegend"><span><i class="lvdot ok"></i>bestätigt</span><span><i class="lvdot maybe"></i>gelesen, noch nicht bestätigt</span><span><i class="lvdot"></i>fehlt</span></div>
    <div class="lvchips" id="lvChips"></div>
  </div>
</div>

<div class="overlay" id="overlay" lang="de" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="sheet"></div>
</div>

<script>
(() => {
"use strict";

/* Felder nach Schweizer Fahrzeugausweis (Feldnummern wie im Ausweis) */
const FIELDS = [
  {g:"halter", k:"name", nr:"01", l:"Name"},
  {g:"halter", k:"vorname", nr:"", l:"Vornamen"},
  {g:"halter", k:"strasse", nr:"", l:"Strasse"},
  {g:"halter", k:"plzOrt", nr:"", l:"PLZ / Ort"},
  {g:"halter", k:"geburtsdatum", nr:"07", l:"Geburtsdatum"},
  {g:"halter", k:"heimatstaat", nr:"08", l:"Heimatstaat"},
  {g:"halter", k:"versicherung", nr:"09", l:"Versicherung"},
  {g:"halter", k:"ausweisNr", nr:"", l:"Ausweis-Nr."},
  {g:"fahrzeug", k:"schild", nr:"15", l:"Kontrollschild"},
  {g:"fahrzeug", k:"schildfarbe", nr:"", l:"Schildfarbe"},
  {g:"fahrzeug", k:"verwendung", nr:"17", l:"Bes. Verwendung"},
  {g:"fahrzeug", k:"art", nr:"19", l:"Art des Fahrzeugs"},
  {g:"fahrzeug", k:"artCode", nr:"", l:"Code Art"},
  {g:"fahrzeug", k:"markeTyp", nr:"21", l:"Marke und Typ"},
  {g:"fahrzeug", k:"fahrgestellNr", nr:"23", l:"Fahrgestell-Nr."},
  {g:"fahrzeug", k:"karosserie", nr:"25", l:"Karosserie"},

async function saveVehicle(v){
  v.geaendert = new Date().toISOString();
  if (storeMode === "db") { await col.doc(v.id).set(v); }
  else { const i = vehicles.findIndex(x => x.id === v.id); if (i >= 0) vehicles[i] = v; else vehicles.push(v); lsSave(); render(); }
}
async function deleteVehicle(id){
  if (storeMode === "db") { await col.doc(id).delete(); }
  else { vehicles = vehicles.filter(x => x.id !== id); lsSave(); render(); }
}

}

}

function parseDate(s){
  const m = String(s || "").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  return m ? +m[3] * 10000 + +m[2] * 100 + +m[1] : null;
}
function sortVal(v, c){
  const raw = c.k === "halter" ? halterOf(v) : v[c.k];
  if (c.date) return parseDate(raw) ?? -1;
  return String(raw || "").toLowerCase();
}
function renderHead(){
  $("#thead").innerHTML = COLS.map(c => {
    const active = c.k === sortKey;
    const arrow = active ? (sortDir > 0 ? "▲" : "▼") : "";
    return `<th><button data-k="${c.k}" ${active ? `aria-sort="${sortDir > 0 ? "ascending" : "descending"}"` : ""}>
      ${c.nr ? `<span class="nr">${c.nr}</span>` : ""}${esc(c.l)} <span aria-hidden="true">${arrow}</span></button></th>`;
  }).join("");
}
function render(){
  renderHead();
  const q = query.trim().toLowerCase();
  let list = vehicles.filter(v => !q || FIELDS.some(f => String(v[f.k] || "").toLowerCase().includes(q)) || halterOf(v).toLowerCase().includes(q));
  const c = COLS.find(x => x.k === sortKey);
  list.sort((a, b) => { const x = sortVal(a, c), y = sortVal(b, c); return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
  $("#tbody").innerHTML = list.map(v => `
    <tr tabindex="0" data-id="${esc(v.id)}">
      <td><span class="plate ${plateClass(v.schildfarbe)}">${esc(v.schild || "—")}</span></td>
      <td><strong>${esc(v.markeTyp || "—")}</strong>${/veteran/i.test(v.verwendung || "") ? `<br><span class="chip vet">Veteran</span>` : v.verwendung ? `<br><span class="chip">${esc(v.verwendung)}</span>` : ""}</td>
      <td>${esc(v.art || "")}</td>
      <td class="mono">${esc(v.inverkehrsetzung || "")}</td>
      <td>${esc(halterOf(v))}</td>
      <td class="mono">${esc(v.stammnummer || "")}</td>
      <td>${esc(v.farbe || "")}</td>
      <td class="mono">${esc(v.pruefung || "")}</td>
    </tr>`).join("");
  $("#tablebox").hidden = view !== "table";
  $("#cards").hidden = view !== "cards" || !list.length;
  $("#cards").innerHTML = view !== "cards" ? "" : list.map(v => `
    <article class="awcard" data-id="${esc(v.id)}">
      <div class="awcard-head"><h3><span class="plate ${plateClass(v.schildfarbe)}">${esc(v.schild || "—")}</span>${esc(v.markeTyp || "")}</h3>
        <button data-open="${esc(v.id)}">Bearbeiten</button></div>
      ${ausweisHTML(v)}
      ${v.bild ? `<details class="foto"><summary>Originalfoto anzeigen</summary><img src="${esc(v.bild)}" alt="Foto des Fahrzeugausweises ${esc(v.schild || "")}" loading="lazy"></details>` : ""}
    </article>`).join("");
  if (view === "cards" && list.length) $("#empty").hidden = true;
  $("#count").textContent = q ? `${list.length} von ${vehicles.length} Fahrzeugen` : `${vehicles.length} Fahrzeug${vehicles.length === 1 ? "" : "e"}`;
  const e = $("#empty");
  if (!vehicles.length) { e.hidden = false; e.innerHTML = "<strong>Noch keine Fahrzeuge erfasst</strong>Foto des Fahrzeugausweises mit «Ausweis einlesen» wählen oder ein Fahrzeug manuell anlegen."; }
  else if (!list.length) { e.hidden = false; e.innerHTML = `<strong>Keine Treffer</strong>Für «${esc(query)}» wurde nichts gefunden.`; }
  else e.hidden = true;
}

let current = null, editing = false, isNew = false, unsure = [];
function openDetail(v, opts = {}){
  if (!v) return;
  current = JSON.parse(JSON.stringify(v)); isNew = !!opts.isNew; editing = !!opts.edit;
  if (!opts.keepTab) detailTab = "ausweis";
  drawSheet(opts.note);
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";
}
function closeDetail(){ unsure = []; $("#sheet").style.maxWidth = ""; $("#overlay").hidden = true; document.body.style.overflow = ""; current = null; }
function drawSheet(note){
  const v = current;
  const group = g => `<fieldset><legend>${GROUPS[g]}</legend>${FIELDS.filter(f => f.g === g).map(f => {
    const val = esc(v[f.k] || "");
    const ro = editing ? "" : "readonly";
    return f.wide
      ? `<div class="row wide${unsure.includes(f.k) && editing ? " unsure" : ""}"><span class="n">${f.nr}</span><label for="f_${f.k}">${esc(f.l)}</label><textarea id="f_${f.k}" data-k="${f.k}" ${ro}>${val}</textarea></div>`
      : `<div class="row${unsure.includes(f.k) && editing ? " unsure" : ""}"><span class="n">${f.nr}</span><label for="f_${f.k}">${esc(f.l)}${f.u ? ` <span class="unit">${f.u}</span>` : ""}</label><input id="f_${f.k}" data-k="${f.k}" value="${val}" ${ro}></div>`;
  }).join("")}</fieldset>`;
  $("#sheet").className = "sheet" + (editing ? " editing" : "");
  $("#sheet").innerHTML = `
    <div class="sheet-head">
      <h2 id="dTitle"><span class="plate ${plateClass(v.schildfarbe)}">${esc(v.schild || "ohne Schild")}</span>${esc(v.markeTyp || (isNew ? "Neues Fahrzeug" : ""))}</h2>
      <div class="actions">
        ${editing
          ? `<button class="primary" id="dSave">Speichern</button><button id="dCancel">${isNew ? "Verwerfen" : "Abbrechen"}</button>`
          : `<div class="seg" role="group" aria-label="Darstellung"><button id="tAw" aria-pressed="${detailTab === "ausweis"}">Ausweis</button><button id="tFe" aria-pressed="${detailTab === "felder"}">Felder</button></div><button class="primary" id="dEdit">Bearbeiten</button><button class="danger" id="dDel">Löschen</button><button id="dClose">Schliessen</button>`}
      </div>
    </div>
    <div class="sheet-body">
      ${note ? `<div class="notice">${esc(note)}</div>` : ""}
      <div id="dConfirm"></div>
      ${!editing && detailTab === "ausweis" ? ausweisHTML(v) : `
      <div class="cols">${group("halter")}${group("fahrzeug")}</div>
      <div class="cols">${group("technik")}${group("daten")}</div>`}
      ${v.bild ? `<details class="foto" ${editing ? "open" : ""}><summary>Originalfoto anzeigen</summary><img src="${esc(v.bild)}" alt="Foto des Fahrzeugausweises"></details>` : ""}
      ${v.geaendert ? `<div class="unit">Zuletzt geändert ${new Date(v.geaendert).toLocaleString("de-CH")}</div>` : ""}
    </div>`;
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("dClose", closeDetail);
  on("tAw", () => { detailTab = "ausweis"; drawSheet(); });
  on("tFe", () => { detailTab = "felder"; drawSheet(); });
  on("dEdit", () => { editing = true; drawSheet(); $("#f_schild")?.focus(); });
  on("dCancel", () => { if (isNew) closeDetail(); else { current = JSON.parse(JSON.stringify(vehicles.find(x => x.id === v.id) || v)); editing = false; drawSheet(); } });
  on("dSave", async () => {
    document.querySelectorAll("#sheet [data-k]").forEach(el => { const t = el.tagName === "TEXTAREA" ? el.value.replace(/\s+$/, "") : el.value.trim(); if (t.trim()) current[el.dataset.k] = t; else delete current[el.dataset.k]; });
    const b = $("#dSave"); b.disabled = true; b.textContent = "Speichert …";
    try { await saveVehicle(current); editing = false; isNew = false; unsure = []; drawSheet(); showMsg("Fahrzeug gespeichert."); }
    catch (e) { b.disabled = false; b.textContent = "Speichern"; showMsg("Speichern fehlgeschlagen: " + (e?.message || e?.code || e), true); }
  });
  on("dDel", () => {
    $("#dConfirm").innerHTML = `<div class="confirm"><span>Fahrzeug ${esc(v.schild || v.markeTyp || "")} endgültig löschen?</span><button class="danger" id="dDelYes">Ja, löschen</button><button id="dDelNo">Behalten</button></div>`;
    on("dDelNo", () => $("#dConfirm").innerHTML = "");
    on("dDelYes", async () => { try { await deleteVehicle(v.id); closeDetail(); showMsg("Fahrzeug gelöscht."); } catch (e) { showMsg("Löschen fehlgeschlagen: " + (e?.message || e?.code), true); } });
  });
}

/* ---------- Bild einlesen ---------- */
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("Bild konnte nicht geöffnet werden.")); img.src = url; });
}
function scaled(img, max, type, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { canvas: c, blob: () => new Promise(r => c.toBlob(r, type, q)), dataUrl: () => c.toDataURL(type, q) };
}
const PROMPT = `Das Bild zeigt einen Schweizer Fahrzeugausweis (Seiten 2 und 3, gedruckte Felder mit Feldnummern). Übertrage jeden Wert ZEICHENGENAU so, wie er gedruckt ist: Sternchen (*) als Füllzeichen bleiben stehen (z.B. "**2500", "****50", "***B00"), ein Feld, das nur Sternchen enthält, wird mit genau diesen Sternchen übernommen (z.B. "******"), Trennlinien aus Bindestrichen (-----) bleiben als eigene Zeile erhalten, Zeilenumbrüche und Einrückungen in den Vermerken bleiben erhalten. Nichts ergänzen, nichts umformatieren. Nur wirklich leere Felder als leerer String. Antworte NUR mit einem JSON-Objekt mit diesen Schlüsseln (alle Werte als Strings):
name (Feld Name), vorname (Vornamen), strasse, plzOrt (PLZ und Ort), geburtsdatum (07), heimatstaat (08), versicherung (09), ausweisNr (Nummer oben rechts auf Seite 2),
schild (15, wie gedruckt, z.B. "ZH124913"), schildfarbe (z.B. weiss, gelb, blau, grün), verwendung (17), art (19), artCode (Code rechts neben 19), markeTyp (21), fahrgestellNr (23), karosserie (25), karosserieCode (Code rechts neben 25), farbe (26), stammnummer (18), typengenehmigung (24),
plaetze (27 total), plaetzeVorne (27 vorne), hubraum (37), leistung (76), leistungsgewicht (78), leergewicht (30), nutzlast (32), gesamtgewicht (33), gewichtZug (35), anhaengelast (31), dachlast (55), emissionscode (72),
inverkehrsetzung (36), ausstellung (38, Ort und Datum), pruefung (39, Datum und Kanton), vermerke (Felder 13/14 Kantonale Vermerke und Verfügungen der Behörde, vollständiger Text mit Codes und Trennlinien, Zeilen mit \\n trennen, Einrückungen als Leerzeichen).`;

$("#scanFile").addEventListener("change", async e => {
  const file = e.target.files?.[0]; e.target.value = "";
  if (!file) return;
  const useSample = !!(sample && imgOK);
  showMsg("");
  let img; try { img = await loadImage(file); } catch (err) { showMsg(err.message, true); return; }
  const thumb = scaled(img, 900, "image/jpeg", 0.68).dataUrl();
  current = { id: newId(), bild: thumb }; isNew = true; editing = false;
  $("#sheet").className = "sheet";
  $("#sheet").innerHTML = `<div class="sheet-head"><h2 id="dTitle">Ausweis wird gelesen</h2><div class="actions"><button id="sAbort">Abbrechen</button></div></div>
    <div class="sheet-body"><div class="status"><span class="spin" aria-hidden="true"></span><span id="sStat">${useSample ? "Claude liest die Felder aus dem Foto …" : "Texterkennung startet …"}</span></div>
    <div class="scan"><img src="${thumb}" alt="Gewähltes Foto"></div></div>`;
  $("#overlay").hidden = false; document.body.style.overflow = "hidden";
  const ac = new AbortController();
  $("#sAbort").onclick = () => { ac.abort(); closeDetail(); if (!useSample && ocrWorker) { ocrWorker.terminate().catch(() => {}); ocrWorker = null; } };
  const status = t => { const el = document.getElementById("sStat"); if (el) el.textContent = t; };
  try {
    const data = useSample
      ? await sample.json(PROMPT, { images: [await scaled(img, 2000, "image/jpeg", 0.88).blob()], signal: ac.signal, modelTier: "default" })
      : await readViaOcr(img, status, ac.signal);
    if (ac.signal.aborted) return;
    finishScan(data, thumb, current.id, useSample ? "claude" : "foto");
  } catch (err) {
    if (ac.signal.aborted) return;
    const map = { not_granted: "Der Zugriff auf Claude wurde nicht erlaubt.", rate_limited: "Gerade zu viele Anfragen. Bitte in einer Minute erneut versuchen.", image_rejected: "Das Bild wurde nicht angenommen (Format oder Grösse).", images_unavailable: "Bilder können in dieser Ansicht nicht gesendet werden." };
    closeDetail();
    showMsg((map[err?.code] || "Einlesen fehlgeschlagen: " + (err?.message || err?.code || err)) + " Du kannst das Fahrzeug auch manuell erfassen.", true);

/* Schräglage schätzen (in Grad) über das Zeilenprofil: kleines Bild, Winkel mit der schärfsten Zeilenstruktur */
function estimateSkew(rgba, w, h) {
  const g = new Uint8Array(w * h);
  let sum = 0; for (let i = 0, j = 0; i < w * h; i++, j += 4) { g[i] = Math.max(rgba[j], rgba[j + 1], rgba[j + 2]); sum += g[i]; }

  const pts = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y * w + x] < thr) pts.push(x, y);
  let best = 0, bestScore = -1;
  for (let a = -6; a <= 6.001; a += 0.2) {
    const t = Math.tan(a * Math.PI / 180), prof = new Float64Array(h * 2);
    for (let k = 0; k < pts.length; k += 2) { const yy = Math.round(pts[k + 1] - pts[k] * t) + (h >> 1); if (yy >= 0 && yy < prof.length) prof[yy]++; }
    let sc = 0; for (let i = 1; i < prof.length; i++) { const d = prof[i] - prof[i - 1]; sc += d * d; }
    if (sc > bestScore) { bestScore = sc; best = a; }
  }
  return best;
}

      if (g[y * w + x] < (s / ((y1 - y0) * (x1 - x0))) * 0.8) b[y * w + x] = 1; } }

    while (stack.length) {

      if (x > 0 && b[q - 1] && !seen[q - 1]) { seen[q - 1] = 1; stack.push(q - 1); }
      if (x < w - 1 && b[q + 1] && !seen[q + 1]) { seen[q + 1] = 1; stack.push(q + 1); }
      if (y > 0 && b[q - w] && !seen[q - w]) { seen[q - w] = 1; stack.push(q - w); }

  const text = lineGroups(values).map(l => join(l.ws)).join("\n");
  if (!out.stammnummer) { const m = text.match(/\b\d{3}[.,]\d{3}[.,]\d{3}\b/); if (m) out.stammnummer = m[0].replace(/,/g, "."); }
  if (!out.schild) { const m = text.match(/\b(AG|AI|AR|BE|BL|BS|FR|GE|GL|GR|JU|LU|NE|NW|OW|SG|SH|SO|SZ|TG|TI|UR|VD|VS|ZG|ZH)\s?(\d{1,6})\b/); if (m) out.schild = m[1] + m[2]; }
  const aus = text.match(/([A-ZÄÖÜ][a-zäöü]+),?\s+den\s+(\d{2}[.,]\d{2}[.,]\d{4})/);
  if (aus) out.ausstellung = `${aus[1]}, den ${aus[2].replace(/,/g, ".")}`;
  if (out.ausstellung) out.ausstellung = out.ausstellung.charAt(0).toUpperCase() + out.ausstellung.slice(1);
  if (!out.pruefung) { const m = text.match(/\b(\d{2}\.\d{2}\.\d{4})\s+([A-Z]{2})\b/); if (m) out.pruefung = m[1] + " " + m[2]; }
  for (const k of Object.keys(out)) if (out[k] == null || out[k] === "") delete out[k];
  return { out, rects, labelH, star, fixNum, dashes: first_dash, conf };
}

/* Zweiter Durchgang: Ergebnisse der Einzelzeilen einarbeiten. res = {feld: {text, words}} */
function refineAusweis(first, res) {
  const out = { ...first.out };
  const { star, labelH } = first;
  const STARF = ["hubraum", "leistung", "leistungsgewicht", "leergewicht", "nutzlast", "gesamtgewicht", "gewichtZug", "anhaengelast", "dachlast", "emissionscode"];
  for (const [f, r] of Object.entries(res)) {
    if (f === "vermerke") continue;
    // Sternchen aus der Bildanalyse: Anzahl Sterne und Zeichen ist zuverlässiger als Tesseract
    if (STARF.includes(f) && r.glyphs && r.glyphs.total >= 4 && r.glyphs.total <= 7) {
      const { stars, total } = r.glyphs;
      const need = Math.max(0, Math.min(6, total) - stars);
      if (need === 0) { out[f] = "******"; continue; }
      let dig = (r.words || []).map(w => w.text).join("").replace(/[^0-9A-Z.]/g, "");
      if (f !== "emissionscode") dig = dig.replace(/[ODQC]/g, "0").replace(/[IL]/g, "1").replace(/S/g, "5").replace(/B/g, "8").replace(/Z/g, "2").replace(/[A-Z]/g, "");
      else dig = dig.replace(/O/g, "0");
      if (r.glyphs.digits && r.glyphs.digits.length === need) { out[f] = "*".repeat(6 - need) + r.glyphs.digits; continue; }
      if (dig.length >= need) { out[f] = "*".repeat(6 - need) + dig.slice(-need); continue; }
      if (!dig.length && first.out[f]) {
        const fd = first.out[f].replace(/^\*+/, "");
        if (fd.length === need) { out[f] = "*".repeat(6 - need) + fd; continue; }
      }
    }
    if (STARF.includes(f) && !(r.words || []).some(w => /[0-9A-Z]/.test(w.text))) {
      // nur Sternchen (oder nichts erkannt): Wert aus dem ersten Durchgang behalten, sonst an der Tinte entscheiden
      if (first.out[f] && /[0-9A-Z]/.test(first.out[f])) continue;
      if (r.ink != null && r.ink > 0.006) out[f] = "******"; else if (r.ink != null) delete out[f];
      continue;
    }
    // Wörter der Zeile: Rauschen am Rand abschneiden
    let ws = (r.words || []).filter(w => w.text.trim() && (STARF.includes(f) || w.conf >= 25) && !/^[|!:;,.'‘’"„“\]\[(){}£%©_~-]+$/.test(w.text.trim())).sort((a, b) => a.x0 - b.x0);
    const cwd = (() => { const q = ws.filter(w => w.text.length >= 3).map(w => (w.x1 - w.x0) / w.text.length).sort((a, b) => a - b); return q.length ? q[Math.floor(q.length / 2)] : labelH; })();
    const groups = []; for (const w of ws) { const g = groups[groups.length - 1]; if (g && w.x0 - g[g.length - 1].x1 < cwd * 3.2) g.push(w); else groups.push([w]); }
    let main = groups[0] || [], tail = groups.slice(1).flat();
    if (STARF.includes(f)) {
      const toks = ws.map(w => ({ w, t: w.text.replace(/[^*0-9A-Z.]/g, "") })).filter(o => o.t);
      const best = toks.sort((a, b) => (/\*/.test(b.t) - /\*/.test(a.t)) || b.t.length - a.t.length)[0];
      main = best ? [best.w] : []; tail = [];
    }
    const meanConf = main.length ? main.reduce((p, w) => p + w.conf, 0) / main.length : 0;
    const t = main.map(w => w.text).join(" ").replace(/\s+/g, " ").trim();
    const tailT = tail.map(w => w.text).join(" ").trim();
    if (!STARF.includes(f) && first.out[f] && meanConf < 70) continue; // erster Durchgang war sicherer
    if (!t) continue;
    if (STARF.includes(f)) {
      // nur das zusammenhängende Wert-Stück nehmen
      const m = (t.replace(/\s/g, "").match(/\*{0,6}[0-9A-Z.]{0,6}/g) || []).filter(Boolean).sort((a, b) => b.length - a.length)[0] || "";
      let v = m; if (v && v.length < 6) v = "*".repeat(6 - v.length) + v;
      if (v.length > 6) v = v.slice(-6);
      v = first.fixNum(f, v);
      if (/^\**[0-9A-Z.]+$/.test(v) && !(first.out[f] && /\d/.test(first.out[f]) && (first.conf[f] || 0) > meanConf + 3)) out[f] = v;
      continue;
    }
    if (f === "stammnummer") { const m = t.replace(/,/g, ".").replace(/\s/g, "").match(/\d{3}\.\d{3}\.\d{3}/); if (m) out[f] = m[0]; continue; }
    if (f === "inverkehrsetzung") { const m = t.replace(/,/g, ".").match(/\d{2}\.\d{2}\.\d{4}/); if (m) out[f] = m[0]; continue; }
    if (f === "pruefung") { const m = (t + " " + tailT).replace(/,/g, ".").match(/(\d{1,2})\.(\d{2})\.(\d{4})(\s+[A-Z]{2})?/); if (m) out[f] = m[1].padStart(2, "1") + "." + m[2] + "." + m[3] + (m[4] || ""); continue; }
    if (f === "ausstellung") { const m = (t + " " + tailT).match(/([A-Za-zÄÖÜäöü][a-zäöü]+),?\s*den\s*(\d{2}[.,]\d{2}[.,]\d{4})/); if (m) out[f] = `${m[1].charAt(0).toUpperCase() + m[1].slice(1)}, den ${m[2].replace(/,/g, ".")}`; else if (!out[f]) out[f] = t; continue; }
    if (f === "plaetze") { const n = t.match(/\d+/g) || []; if (n[0]) out.plaetze = n[0]; if (n[1]) out.plaetzeVorne = n[1]; continue; }
    if (f === "schild") { const all = t + " " + tailT; const m = all.match(/\b([A-Z]{2})\s?(\d{1,6})\b/); if (m) out.schild = m[1] + m[2]; else if (!out.schild) { const q = all.match(/\b[A-Z][A-Z-.]?\s?\d{3,6}\b/); if (q) out.schild = q[0]; } const fb = all.match(/\b(weiss|gelb|blau|grün|braun)\b/i); if (fb) out.schildfarbe = fb[1].toLowerCase(); continue; }
    if (f === "art" || f === "karosserie") {
      const code = (tailT.match(/\b\d{1,3}\b/) || [])[0];
      if (t && meanConf >= 70) out[f] = t;
      if (code) out[f === "art" ? "artCode" : "karosserieCode"] = code;
      continue;
    }
    out[f] = t.replace(/^[|!:;,.\-\s]+|[|!:;,\s]+$/g, "");
  }
  // Vermerke aus dem Einzeldurchgang, falls er mehr gefunden hat
  const vr = res.vermerke;
  if (vr && vr.words && vr.words.length) {
    const ws = vr.words.filter(w => w.conf >= 45 && (w.y1 - w.y0) >= labelH * 0.9);
    const v = buildVermerke(ws, first.dashes, labelH);
    const score = x => (x || "").replace(/[^A-Za-zÄÖÜäöü0-9]/g, "").length;
    if (score(v) > score(out.vermerke) * 1.05) out.vermerke = v;
  }
  if (out.schild) { const m = out.schild.match(/^Z[-.|:;!]\s?(\d{3,6})$/); if (m) out.schild = "ZH" + m[1]; }
  if (out.emissionscode) out.emissionscode = out.emissionscode.replace(/O/g, "0");
  for (const k of Object.keys(out)) if (out[k] == null || out[k] === "") delete out[k];
  const confs = {};
  for (const [f, r] of Object.entries(res)) { const ws = (r.words || []).filter(w => w.text && w.text.trim()); confs[f] = ws.length ? ws.reduce((p, w) => p + w.conf, 0) / ws.length : 0; }
  if (confs.art != null) confs.artCode = confs.art; if (confs.karosserie != null) confs.karosserieCode = confs.karosserie;
  if (confs.schild != null) confs.schildfarbe = confs.schild; if (confs.plaetze != null) confs.plaetzeVorne = confs.plaetze;
  Object.defineProperty(out, "_conf", { value: confs, enumerable: false });
  return out;
}

/* Vermerke-Text aus Wortpositionen: Zeilen, Einrückung, Trennlinien */
function buildVermerke(wordsIn, dashes, labelH) {
  const ws = wordsIn.filter(w => w.text && w.text.trim());
  const cy = w => (w.y0 + w.y1) / 2, Hh = w => w.y1 - w.y0;
  const r = ws.filter(w => /^[\w.:/äöüÄÖÜ-]{3,}$/.test(w.text)).map(w => (w.x1 - w.x0) / w.text.length).sort((a, b) => a - b);
  const cw = r.length ? r[Math.floor(r.length / 2)] : labelH * 0.9;
  const items = [...ws];
  for (const d of dashes || []) items.push({ text: "-".repeat(Math.max(3, Math.round((d.x1 - d.x0) / cw))), x0: d.x0, x1: d.x1, y0: d.y0 - labelH * 0.6, y1: d.y1 + labelH * 0.6, dash: true });
  const lines = [];
  for (const w of items.sort((a, b) => cy(a) - cy(b))) {
    const l = lines.find(l => Math.abs(l.cy - cy(w)) < Math.max(Hh(w), labelH) * 0.55);
    if (l && !w.dash && !l.dash) l.ws.push(w); else lines.push({ cy: cy(w), ws: [w], dash: !!w.dash });
  }
  lines.forEach(l => l.ws.sort((a, b) => a.x0 - b.x0));
  lines.sort((a, b) => a.cy - b.cy);
  if (!lines.length) return "";
  const minX = Math.min(...lines.map(l => l.ws[0].x0));
  const out = lines.map(l => {
    let s = " ".repeat(Math.max(0, Math.round((l.ws[0].x0 - minX) / cw))), px = null;
    for (const w of l.ws) {
      if (px != null) s += " ".repeat(Math.max(1, Math.round((w.x0 - px) / cw)));
      let t = w.text;
      if (!w.dash && t.length >= 3 && (t.match(/[-—–_~=]/g) || []).length / t.length > 0.5) t = "-".repeat(Math.max(3, Math.round((w.x1 - w.x0) / cw)));
      s += t; px = w.x1;
    }
    return s.replace(/\s+$/, "");
  }).filter(l => l.trim().length > 1);
  const ind = Math.min(...out.filter(l => !/^\s*-+$/.test(l)).map(l => l.match(/^ */)[0].length));
  return out.map(l => l.slice(Math.min(ind, l.match(/^ */)[0].length))).join("\n");
}

/* Plausibilität eines Feldwerts (0 = unbrauchbar, 2 = Format stimmt) */
const KANTONE = "AG AI AR BE BL BS FR GE GL GR JU LU NE NW OW SG SH SO SZ TG TI UR VD VS ZG ZH".split(" ");
function plausibel(f, v) {
  if (v == null || v === "") return 0;
  v = String(v);
  const STARF = ["hubraum", "leistung", "leistungsgewicht", "leergewicht", "nutzlast", "gesamtgewicht", "gewichtZug", "anhaengelast", "dachlast"];
  const date = x => { const m = x.match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12 && +m[3] > 1880 && +m[3] < 2100; };
  if (STARF.includes(f)) {
    if (!(/^\*{0,6}[0-9.]{0,6}$/.test(v) && v.length === 6)) return 0;
    if (/^\*{6}$/.test(v)) return 2;
    const d = v.replace(/^\*+/, "");
    if (/\*/.test(d) || /^0\d/.test(d)) return 0;
    if (f === "leistungsgewicht") return /^\d?\.\d+$|^\d{1,3}$/.test(d) ? 2 : 1;
    if (d.length < 2) return 0;                       // einstellige Gewichte, Hubraum usw. gibt es nicht
    const n = parseFloat(d);
    const range = { hubraum: [40, 30000], leistung: [1, 2000], leergewicht: [50, 60000], gesamtgewicht: [100, 60000], gewichtZug: [100, 80000], nutzlast: [10, 60000], anhaengelast: [10, 60000], dachlast: [10, 500] }[f];
    return range && (n < range[0] || n > range[1]) ? 0 : 2;
  }
  if (f === "emissionscode") return /^\*{0,6}[0-9A-Z]{0,6}$/.test(v) && v.length === 6 ? 2 : 0;
  if (f === "geburtsdatum" || f === "inverkehrsetzung") return date(v) ? 2 : 0;
  if (f === "pruefung") { const m = v.match(/^(\S+)(?: ([A-Z]{2}))?$/); return m && date(m[1]) ? (m[2] && KANTONE.includes(m[2]) ? 2 : 1) : 0; }
  if (f === "stammnummer") return /^\d{3}\.\d{3}\.\d{3}$/.test(v) ? 2 : 0;
  if (f === "schild") { const m = v.match(/^([A-Z]{2})(\d{1,6})$/); return m ? (KANTONE.includes(m[1]) ? 2 : 1) : 0; }
  if (f === "ausweisNr") return /^\d{8}$/.test(v) ? 2 : /^\d{6,10}$/.test(v) ? 1 : 0;
  if (["plaetze", "plaetzeVorne", "artCode", "karosserieCode"].includes(f)) return /^\d{1,3}$/.test(v) ? 2 : 0;
  if (f === "heimatstaat") return /^[A-Z]{1,3}$/.test(v) ? 2 : 0;
  if (f === "ausstellung") return /^[A-ZÄÖÜ][a-zäöü]+, den \d{2}\.\d{2}\.\d{4}$/.test(v) ? 2 : 1;
  if (f === "plzOrt") return /^\d{4} [A-ZÄÖÜ]/.test(v) ? 2 : 1;
  if (f === "vermerke") return 1;
  const FARBEN = /^(weiss|schwarz|grau|silber|rot|blau|grün|gelb|orange|braun|beige|violett|lila|gold|bronze|türkis|rosa|anthrazit|bordeaux|mehrfarbig|dunkelblau|hellblau|dunkelgrün|hellgrün|dunkelgrau|hellgrau|dunkelrot|elfenbein|creme)(\s.*)?$/i;
  const letters = (v.match(/[A-Za-zÄÖÜäöüéèàç]/g) || []).length;
  if (["markeTyp", "versicherung", "name", "vorname", "strasse", "verwendung", "art", "karosserie", "farbe", "typengenehmigung"].includes(f) && letters < 2) return 0;
  if (f === "fahrgestellNr") { const an = v.replace(/[^A-Z0-9]/g, ""); return an.length >= 6 && an.length <= 20 && an.length >= v.replace(/\s/g, "").length - 2 ? 2 : 0; }
  if (f === "typengenehmigung") return v.replace(/[^A-Za-z0-9]/g, "").length >= 3 ? 2 : 0;
  if (f === "farbe") return FARBEN.test(v) ? 2 : letters >= 3 ? 1.5 : 0;
  if ((f === "karosserie" || f === "art" || f === "markeTyp" || f === "verwendung") && FARBEN.test(v)) return 0;
  // Freitext: seltsame Zeichen und Kurz-Schnipsel kosten Punkte
  const weird = (v.match(/[^A-Za-zÄÖÜäöüéèàç0-9 .,\/\-()&']/g) || []).length;
  const toks = v.split(" ");
  const junk = toks.filter(t => t.length <= 2 && /[a-z]/.test(t) && /[A-Z]/.test(t)).length + (toks.length > 1 && /^[^\d]$/.test(toks[0]) ? 1 : 0);
  return Math.max(0, 2 - weird * 0.6 - junk * 0.6);
}

/* Zwei Lesungen zusammenführen. a/b: Feldwerte, ca/cb: Konfidenzen je Feld. Liefert {out, unsicher} */
function vergleicheLesungen(a, b, ca = {}, cb = {}) {
  const out = {}, unsicher = [];
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  const norm = x => String(x ?? "").replace(/\s+/g, " ").trim();
  for (const f of keys) {
    const va = a[f], vb = b[f];
    if (f === "vermerke") {
      const sc = x => (x || "").replace(/[^A-Za-zÄÖÜäöü0-9]/g, "").length;
      out[f] = sc(vb) > sc(va) * 1.1 ? vb : (va || vb);
      continue;
    }
    if (!va && !vb) continue;
    if (norm(va) === norm(vb)) { out[f] = va; continue; }
    const pa = plausibel(f, va), pb = plausibel(f, vb);
    let pick;
    if (pa !== pb) pick = pa > pb ? va : vb;
    else if (!va || !vb) pick = va || vb;
    else pick = (ca[f] ?? 0) >= (cb[f] ?? 0) ? va : vb;
    if (pick) out[f] = pick;
    if (va && vb) unsicher.push(f);
    else if (plausibel(f, pick) < 2) unsicher.push(f);
  }
  return { out, unsicher };
}

/* ---------- Backup / Restore ---------- */
$("#backupBtn").onclick = async () => {
  const payload = JSON.stringify({ format: "fahrzeugregister", version: 1, exportiert: new Date().toISOString(), fahrzeuge: vehicles }, null, 2);
  const d = new Date(), name = `fahrzeugregister-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  if (downloads) {
    try { await downloads.save({ filename: name, data: new Blob([payload], { type: "application/json" }) }); showMsg(`Backup mit ${vehicles.length} Fahrzeugen bereitgestellt.`); return; }
    catch (e) { if (e?.code === "declined" || e?.code === "cancelled") { showMsg("Backup abgebrochen."); return; } }
  }
  if (!window.claude) {
    const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showMsg(`Backup mit ${vehicles.length} Fahrzeugen heruntergeladen.`); return;
  }
  current = null;
  $("#sheet").className = "sheet";
  $("#sheet").innerHTML = `<div class="sheet-head"><h2 id="dTitle">Backup</h2><div class="actions"><button class="primary" id="bCopy">Kopieren</button><button id="bClose">Schliessen</button></div></div>
    <div class="sheet-body"><div class="notice">Datei-Download ist in dieser Ansicht nicht möglich. Kopiere den Inhalt und speichere ihn als <span class="mono">${name}</span>.</div><textarea class="dump" id="bText" readonly></textarea></div>`;
  $("#bText").value = payload; $("#overlay").hidden = false;
  $("#bClose").onclick = closeDetail;
  $("#bCopy").onclick = async () => { try { await navigator.clipboard.writeText(payload); $("#bCopy").textContent = "Kopiert"; } catch { $("#bText").select(); } };
};

$("#restoreFile").addEventListener("change", async e => {
  const file = e.target.files?.[0]; e.target.value = ""; if (!file) return;
  let list;
  try { const j = JSON.parse(await file.text()); list = Array.isArray(j) ? j : j.fahrzeuge; if (!Array.isArray(list)) throw 0; }
  catch { showMsg("Die Datei ist kein gültiges Fahrzeugregister-Backup.", true); return; }
  list = list.filter(v => v && typeof v === "object").map(v => ({ ...v, id: typeof v.id === "string" && /^[\w-]{1,80}$/.test(v.id) ? v.id : newId() }));
  pendingRestore = list;
  const m = $("#msg"); m.className = "notice"; m.hidden = false;
  m.innerHTML = `<div class="confirm" style="border-color:var(--accent)"><span>Backup mit ${list.length} Fahrzeugen gefunden. Wie wiederherstellen?</span>
    <button class="primary" id="rMerge">Zusammenführen</button><button class="danger" id="rReplace">Alles ersetzen</button><button id="rNo">Abbrechen</button></div>`;
  $("#rNo").onclick = () => { pendingRestore = null; m.hidden = true; };
  $("#rMerge").onclick = () => doRestore(false);
  $("#rReplace").onclick = () => doRestore(true);
});
async function doRestore(replace){
  const list = pendingRestore; pendingRestore = null; if (!list) return;
  showMsg("Wiederherstellung läuft …");
  try {
    if (storeMode === "db") {
      if (replace) { const keep = new Set(list.map(v => v.id)); for (const v of vehicles) if (!keep.has(v.id)) await col.doc(v.id).delete(); }
      for (const v of list) await col.doc(v.id).set(v);
    } else {
      if (replace) vehicles = [];
      for (const v of list) { const i = vehicles.findIndex(x => x.id === v.id); if (i >= 0) vehicles[i] = v; else vehicles.push(v); }
      lsSave(); render();
    }
    showMsg(`${list.length} Fahrzeuge wiederhergestellt${replace ? " (Bestand ersetzt)" : ""}.`);
  } catch (e) { showMsg("Wiederherstellung fehlgeschlagen: " + (e?.message || e?.code), true); }
}

/* ---------- Start ---------- */
vehicles = lsLoad(); setSub(); setView(view);

(async () => {
  const c = window.claude; if (!c?.use) return;
  c.use("downloads").then(d => downloads = d).catch(() => {});
  c.use("sample").then(async s => {
    sample = s;
    const lim = s ? await s.limits().catch(() => null) : null;
    imgOK = !!lim?.images;
    if (lim?.images?.mediaTypes?.length) $("#scanFile").accept = lim.images.mediaTypes.join(",");
  }).catch(() => {});
  db = await c.use("db").catch(() => null);
  if (!db) return;
  col = db.collection("fahrzeuge");
  let first = true;
  const timer = setTimeout(() => showMsg("Die gespeicherten Fahrzeuge sind noch nicht erreichbar. Angezeigt wird der lokale Stand.", true), 10000);
  col.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    storeMode = "db"; setSub();
    vehicles = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    if (first && !snap.metadata.fromCache) { first = false; $("#msg").hidden = true; }
    render();
  }, err => { clearTimeout(timer); storeMode = "local"; setSub(); vehicles = lsLoad(); render(); showMsg("Zugriff auf den gemeinsamen Speicher nicht möglich (" + (err?.code || "Fehler") + "). Es wird lokal gespeichert.", true); });
})();
})();
